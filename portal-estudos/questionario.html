<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Questionário - Formulário</title>
    <link rel="stylesheet" href="estilo.css">
</head>
<body>

    <main class="container">
        <header class="header">
            <span class="tag">PESQUISA DE PERFIL</span>
            <h1>Questionário Acadêmico</h1>
            <p>Responda às perguntas abaixo para enriquecer seu cadastro.</p>
        </header>

        <section class="card full-width">
            <h2>Perguntas Gerais</h2>
            <form id="form-questionario">
                <div class="form-group">
                    <label for="semestre">Em qual semestre você está?</label>
                    <select id="semestre" required>
                        <option value="" disabled selected>Selecione...</option>
                        <option value="1">1º Semestre</option>
                        <option value="2">2º Semestre</option>
                        <option value="3">3º Semestre ou mais</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Qual seu período de estudo?</label>
                    <div class="radio-group">
                        <label><input type="radio" name="periodo" value="matutino" required> Matutino</label>
                        <label><input type="radio" name="periodo" value="noturno"> Noturno</label>
                    </div>
                </div>

                <div class="form-group">
                    <label for="comentarios">Observações adicionais:</label>
                    <textarea id="comentarios" rows="4" placeholder="Escreva aqui..."></textarea>
                </div>

                <div class="button-group">
                    <button type="submit" class="btn btn-primary">Enviar Questionário</button>
                    <button type="reset" class="btn btn-secondary">Limpar</button>
                </div>
            </form>
        </section>

        <footer class="footer-info">
            <p>Atividade acadêmica · Use apenas dados fictícios</p>
            <p class="nav-link-box">
                <a href="acesso.html" class="link-paginas">&larr; Voltar para Acesso</a>
            </p>
        </footer>
    </main>

    <script src="interacao.js"></script>
</body>
</html>
